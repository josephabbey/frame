[project]
name = "frame"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Joseph Abbey", email = "me@josephabbey.dev" }]
requires-python = ">=3.14"
dependencies = [
  "dacite>=1.9.2",
  "httpx>=0.28.1",
  "httpx-file>=0.2.0",
  "inky>=2.6.0",
  "material-color-utilities>=0.2.6",
  "pillow>=13.0.0",
  "qrcode[pil]>=8.2",
  "websockets>=17.4",
]

[project.scripts]
frame = "frame:display"
debug = "frame:debug"

[build-system]
requires = ["uv_build>=0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.3", "ty>=0.0.95", "watchfiles>=1.3.0"]

[tool.ruff]
indent-width = 2
